name: docs

# The docs site: build and check on every change, deploy to Cloudflare Pages on
# main (PRD §9).
#
# The build+check job runs for everyone, including forks and PRs, because it is
# the gate: broken internal links and a blown client-JS budget fail here rather
# than on the live site. Deploy is separate and only runs on main, where the
# secrets exist.

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-deploy.yml'
  pull_request:
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-deploy.yml'
  # A deploy is not always caused by a content change. Rotating the Cloudflare
  # token, attaching a custom domain, or recreating the Pages project all need a
  # deployment to exist before they take effect -- and without this the only way
  # to get one was to invent a change to docs-site/ and push it. The release
  # workflow carries workflow_dispatch for the same reason.
  workflow_dispatch:

# Never let two runs of the same ref race. On a PR branch a new push makes the
# running check moot, so cancel it. On main, never cancel: a cancelled deploy can
# stop wrangler partway through an upload, and queueing keeps the order without
# killing either run.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: docs-site

jobs:
  build:
    name: build + check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # Full history: the sitemap's <lastmod> and each page's dateModified
          # are the git commit date of that page's source. The default shallow
          # checkout leaves one commit, which would give every page the same
          # date and tell crawlers the whole site changed on every deploy.
          # scripts/gen-lastmod.mjs refuses to run against a shallow clone
          # rather than emitting that, so without this the build fails loudly.
          fetch-depth: 0
          # The token is not left in .git/config for npm ci's install scripts,
          # or anything else in the build, to read. Nothing here pushes.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      # The build runs on a runner, and the deploy job's runner holds the
      # Cloudflare token: a known-vulnerable build dependency (Astro 7.1 shipped
      # with a critical image-pipeline RCE) is a supply-chain hole even though
      # the output is static. Fail on high or critical, not on moderates.
      - name: audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: build
        run: npm run build
      # `build` also runs scripts/gen-csp.mjs, which writes the CSP into
      # dist/_headers; check re-derives it and fails on a missing hash.
      - name: check (links, budgets, headers, CSP, security.txt)
        run: npm run check
      - name: upload site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: docs-site/dist
          retention-days: 7
          # upload-artifact skips dot-files by default since v4.4, which would
          # silently drop .well-known/security.txt from what gets deployed.
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    name: deploy to Cloudflare Pages
    needs: build
    # Only on main, and never from a fork PR — a fork must not reach the account
    # token. workflow_dispatch is included because that trigger exists to force
    # a deployment (see `on:`); with `push` alone a manual run built and checked
    # but never deployed.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    # Ships the artifact the build job uploaded -- the exact bytes that passed
    # `npm run check` -- instead of checking out and building again. A rebuild
    # here would deploy output nothing had checked (a dependency could resolve
    # differently, a generator could run against a different clock), and it
    # would run npm install scripts on the one runner that holds the Cloudflare
    # token. So: no checkout, no npm ci, and no fetch-depth: 0 (only the build
    # job needs history, for gen-lastmod).
    steps:
      - name: download the checked site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: docs-site/dist
      # Cheap insurance that the artifact is the whole site: _headers carries
      # the security headers and CSP, and the dot-directory is the one an
      # artifact upload drops by default.
      - name: artifact sanity
        run: |
          test -f dist/index.html
          grep -q '^  Content-Security-Policy: ' dist/_headers
          test -f dist/.well-known/security.txt
      - name: publish
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned: unpinned, the action installs whatever wrangler is newest at
          # deploy time -- an unreviewed dependency on the token-holding runner.
          # Bump deliberately.
          wranglerVersion: '4.154.0'
          workingDirectory: docs-site
          # With no checkout, wrangler cannot read the branch and commit from
          # .git, so both are passed; --branch=main is what makes this the
          # production deployment. github.sha is a hex digest, not user-supplied
          # text, so interpolating it into the command is safe.
          command: pages deploy dist --project-name=rowshape-docs --branch=main --commit-hash=${{ github.sha }}
