name: docs

# The docs site: build and check on every change, deploy to Cloudflare Pages on
# main (PRD §9).
#
# The build+check job runs for everyone, including forks and PRs, because it is
# the gate: broken internal links and a blown client-JS budget fail here rather
# than on the live site. Deploy is separate and only runs on main, where the
# secrets exist.

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-deploy.yml'
  pull_request:
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-deploy.yml'
  # A deploy is not always caused by a content change. Rotating the Cloudflare
  # token, attaching a custom domain, or recreating the Pages project all need a
  # deployment to exist before they take effect -- and without this the only way
  # to get one was to invent a change to docs-site/ and push it. The release
  # workflow carries workflow_dispatch for the same reason.
  workflow_dispatch:

# Never let two deploys of the same branch race.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: docs-site

jobs:
  build:
    name: build + check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history: the sitemap's <lastmod> and each page's dateModified
          # are the git commit date of that page's source. The default shallow
          # checkout leaves one commit, which would give every page the same
          # date and tell crawlers the whole site changed on every deploy.
          # scripts/gen-lastmod.mjs refuses to run against a shallow clone
          # rather than emitting that, so without this the build fails loudly.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - name: build
        run: npm run build
      - name: check (links + client-JS budget)
        run: npm run check
      - name: upload site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-site
          path: docs-site/dist
          retention-days: 7

  deploy:
    name: deploy to Cloudflare Pages
    needs: build
    # Only on main, and never from a fork PR — a fork must not reach the account
    # token.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history: the sitemap's <lastmod> and each page's dateModified
          # are the git commit date of that page's source. The default shallow
          # checkout leaves one commit, which would give every page the same
          # date and tell crawlers the whole site changed on every deploy.
          # scripts/gen-lastmod.mjs refuses to run against a shallow clone
          # rather than emitting that, so without this the build fails loudly.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: publish
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs-site
          command: pages deploy dist --project-name=rowshape-docs
