name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.x"

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # This job runs the FULL suite once against a representative major. The
        # Postgres 11-17 version matrix for the corpus (including the version-
        # conditional finding rules) lives in corpus.yml (P2-T13), which runs the
        # corpus against every supported major.
        pg: ["16"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build
        run: go build ./...
      - name: Test
        env:
          ROWSHAPE_PG_VERSION: ${{ matrix.pg }}
          # Real seeded Postgres for the pull/profile catalog tests (P1-T3+),
          # the Docker-free equivalent of the RFC §13 testcontainers target.
          ROWSHAPE_TEST_PG_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test ./...

  race:
    # Nothing ran the race detector, yet the capture path holds a pgx connection
    # across a transaction and the profiler fans work out across columns — the two
    # places a data race could actually live. This runs the library + command
    # tests under -race against a real Postgres. It skips the heavy test/demo and
    # test/action end-to-end suites (they build and exec the binary; -race there
    # buys little for a lot of wall-clock) and stays on a single representative
    # major — a race is not version-conditional.
    name: race detector
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test -race (library + command tests)
        env:
          ROWSHAPE_TEST_PG_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -race ./internal/... ./cmd/... -count=1

  canonical-cross-platform:
    # RFC §11 / §13: the canonical form, digest, and hydrate output MUST be
    # byte-identical across platforms. The fixture and hydrate packages' golden,
    # digest-stability, and determinism tests therefore run on linux, darwin, and
    # windows (P1-T2 / P1-T7 verification). These need no Postgres, so the job
    # stays cheap and independent of the phase-2 PG version matrix.
    name: canonical form + hydrate (cross-platform)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Scope note: this job used to run only ./internal/fixture/... and
      # ./internal/hydrate/..., which left every path-handling, file-discovery,
      # and hook-writing package untested off Linux. That gap is what allowed a
      # case-sensitive ".sql" match in cmd/validate.go to ship — a bug that can
      # only appear on the case-insensitive filesystems Windows and macOS
      # default to. The packages below need no Postgres, so the job stays cheap.
      - name: Test canonical form, digest, hydrate determinism, and CLI paths
        run: go test ./internal/... ./cmd/...

  # The npm wrapper's guards previously ran ONLY in release.yml, which is far too
  # late for a supply-chain check: a regression in the installer's verification
  # or archive naming would not surface until a tag was already being cut. They
  # need no network and no release, so they run on every push.
  npm-wrapper:
    name: npm wrapper (naming + verification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Archive naming matches goreleaser
        run: node npm/naming.test.js
      - name: Installer refuses anything it cannot verify
        run: node npm/verify.test.js

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        # v8 of the action is required to run golangci-lint v2, which is what
        # .golangci.yml is written against (`version: "2"`). The v6 action only
        # drives golangci-lint v1 and cannot read that config at all.
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          # Pinned, not `latest`. With `latest`, a new golangci-lint release adds
          # checks overnight and turns CI red on a commit that changed nothing —
          # which trains everyone to ignore the lint job. Bump this deliberately.
          #
          # A pin also has to be able to READ go.mod: golangci-lint refuses to start
          # when the Go version it was BUILT with is lower than the module's `go`
          # directive ("can't load config: the Go language version (go1.25) used to
          # build golangci-lint is lower than the targeted Go version"). That is a
          # lint job that never runs a single check, on a repo whose one-command
          # verification is meant to be the thing you trust. Keep this pin and the
          # go directive compatible when either moves.
          version: v2.12.2

  determinism-matrix:
    # CR-T14. INV-DETERMINISM promises byte-identical hydrate output on ANY
    # platform, but nothing enforced it across architectures — and the risk was
    # concrete, not theoretical: the synthesis path had `x + y*z` expressions,
    # which the Go spec lets an implementation fuse into a single FMA, and the
    # compiler DOES fuse them on arm64 while amd64 does not. Measured, fusing
    # changes ~0.07% of the emitted int64 values (about one row in 1,380).
    #
    # This job runs the hydrate digest test on BOTH architectures. The promise is
    # cross-architecture, so a single-architecture check could never have caught
    # the one bug it exists to catch.
    name: hydrate determinism (${{ matrix.arch.runner }})
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { runner: ubuntu-latest }
          - { runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Report architecture
        run: go env GOARCH GOOS
      - name: Hydrate determinism (golden digest must match on every GOARCH)
        run: go test ./internal/hydrate/ -run 'TestHydrateOutputDigestIsStable|TestLerpIsFusionStable|TestFMAFusionWouldChangeSynthesizedValues' -v
